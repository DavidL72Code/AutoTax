<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ReceiptAuto">
  <title>ReceiptAuto — stack</title>
  <defs>
    <linearGradient id="k-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="k-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="k-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The receipt reduced to the only part of it that is distinctive: the torn
       edge. Two strips, tilted and layered, so it reads as a stack of them
       rather than one literal slip. -->
  <g transform="rotate(-14 32 32)">
    <path d="M15 10H31V44L28 47.6L25 44L22 47.6L19 44L15 47.6V10Z" fill="url(#k-back)"/>
    <g filter="url(#k-glow)">
      <path d="M27 6H47V46L43 50L39 46L35 50L31 46L27 50V6Z" fill="url(#k-front)"/>
    </g>
    <rect x="32" y="15" width="10" height="3.4" rx="1.7" fill="#0b1424" fill-opacity="0.55"/>
    <rect x="32" y="23" width="6" height="3.4" rx="1.7" fill="#0b1424" fill-opacity="0.4"/>
  </g>
</svg>
