<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ReceiptAuto">
  <title>ReceiptAuto — aperture</title>
  <!-- Six blades at 60°, struck from an outer radius of 26 to an inner of 10.5,
       leaving a hexagonal eye. An iris means capture without drawing a camera,
       a receipt, or anything else literal. -->
  <g fill="#c6a15b">
    <polygon points="34.72,6.14 53.03,16.72 40.49,25.83 33.10,21.56"/>
    <polygon points="34.72,6.14 53.03,16.72 40.49,25.83 33.10,21.56" transform="rotate(60 32 32)"/>
    <polygon points="34.72,6.14 53.03,16.72 40.49,25.83 33.10,21.56" transform="rotate(120 32 32)"/>
    <polygon points="34.72,6.14 53.03,16.72 40.49,25.83 33.10,21.56" transform="rotate(180 32 32)"/>
    <polygon points="34.72,6.14 53.03,16.72 40.49,25.83 33.10,21.56" transform="rotate(240 32 32)"/>
    <polygon points="34.72,6.14 53.03,16.72 40.49,25.83 33.10,21.56" transform="rotate(300 32 32)"/>
  </g>
</svg>
