<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ReceiptAuto">
  <title>ReceiptAuto — cleared</title>
  <defs>
    <linearGradient id="c-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="c-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="c-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- No receipt at all. The mark is the outcome: cleared. A hairline orbit
       with a gap where the check breaks through, so the ring reads as motion
       rather than a border. -->
  <path d="M32 4.5A27.5 27.5 0 1 1 12.6 51.4" fill="none" stroke="url(#c-ring)" stroke-width="3"
        stroke-linecap="round"/>

  <g filter="url(#c-glow)">
    <path d="M17 33.5L27.5 44L48 20" fill="none" stroke="url(#c-grad)" stroke-width="7.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
