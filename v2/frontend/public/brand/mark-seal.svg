<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ReceiptAuto">
  <title>ReceiptAuto — seal</title>
  <!-- Porsche logic: a quartered heraldic field, drawn flat. Alternating
       quarters carry the colour, a hairline ring holds it together, and a
       single bar sits on the horizon — the total, ruled off. Nothing is
       depicted; the structure does the work. -->
  <defs>
    <clipPath id="seal-clip"><circle cx="32" cy="32" r="24"/></clipPath>
  </defs>

  <g clip-path="url(#seal-clip)" fill="#c6a15b">
    <rect x="8" y="8" width="24" height="24"/>
    <rect x="32" y="32" width="24" height="24"/>
  </g>

  <circle cx="32" cy="32" r="24" fill="none" stroke="#c6a15b" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="28.6" fill="none" stroke="#c6a15b" stroke-width="1.4" stroke-opacity="0.55"/>
  <rect x="19" y="30.4" width="26" height="3.2" fill="#060a14"/>
  <rect x="19" y="30.4" width="12" height="3.2" fill="#c6a15b"/>
</svg>
