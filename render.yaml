services:
  # v2's API. Pure Python: Vercel serves the interface and forwards /api here,
  # so nothing on this side builds or ships the front end. v1's service below is
  # untouched and still runs.
  #
  # The browser only ever sees Vercel's origin, so this needs no CORS entry and
  # the session cookie is never cross-site.
  - type: web
    name: receipts-v2-api
    env: python
    plan: free
    rootDir: v2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Encrypts the Gmail refresh token at rest. Without it the app cannot
      # store a credential at all.
      - key: FERNET_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Must match an authorised redirect URI in Google Cloud Console, and
      # points at this service since it serves the front end too.
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Paused reviews live in the checkpointer. The free plan sleeps when idle,
      # which drops in-process state, so sqlite keeps a queue across restarts.
      # It writes email bodies to disk: leave it as memory if that matters more.
      - key: CHECKPOINT_BACKEND
        value: sqlite

  - type: web
    name: receipt-automation-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: receipt-automation-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_FIRESTORE_TOKENS_COLLECTION
        value: google_credentials
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_WEB_MEASUREMENT_ID
        sync: false

databases:
  - name: receipt-automation-db
    plan: free
